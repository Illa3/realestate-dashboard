<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관심구역 부동산 대시보드</title>
<script src="config.js"></script>
<style>
  :root {
    --bg: #f7f7f8; --card: #ffffff; --text: #1a1a1a; --muted: #6b7280;
    --accent: #d0392b; --border: #e5e7eb; --badge: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15161a; --card: #1f2024; --text: #ececec; --muted: #9aa0a6; --border: #2d2f34; --badge: #2a2d3a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { padding: 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
  h1 { font-size: 17px; margin: 0; }
  nav { display: flex; gap: 6px; }
  nav button { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
  nav button.active { background: var(--accent); color: white; border-color: var(--accent); }
  main { padding: 12px; max-width: 720px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--badge); color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  .alert { background: #fdecea; color: var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 6px; }
  @media (prefers-color-scheme: dark) { .alert { background: #3a2422; } }
  .listing-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--border); }
  .listing-row:first-child { border-top: none; }
  form.inline { display: flex; flex-direction: column; gap: 8px; }
  input, select { padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 14px; }
  button.primary { background: var(--accent); color: white; border: none; padding: 9px 14px; border-radius: 8px; font-size: 14px; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 12px; }
  .row-actions { display: flex; gap: 6px; margin-top: 8px; }
  #manage-view[hidden], #dashboard-view[hidden], #upload-view[hidden] { display: none; }
  .status-pending { color: #b45309; }
  .status-processed { color: #15803d; }
  .status-error { color: var(--accent); }
  details { margin-top: 6px; }
  details summary { cursor: pointer; font-size: 13px; padding: 6px 0; color: var(--muted); border-top: 1px solid var(--border); }
  details[open] summary { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>🏠 관심구역 대시보드</h1>
  <nav>
    <button id="tab-dashboard" class="active">대시보드</button>
    <button id="tab-upload">업로드</button>
    <button id="tab-manage">관리</button>
  </nav>
</header>

<main id="dashboard-view"></main>
<main id="upload-view" hidden></main>
<main id="manage-view" hidden></main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const dashboardEl = document.getElementById("dashboard-view");
const manageEl = document.getElementById("manage-view");
const uploadEl = document.getElementById("upload-view");
const tabDashboard = document.getElementById("tab-dashboard");
const tabManage = document.getElementById("tab-manage");
const tabUpload = document.getElementById("tab-upload");

const TYPE_LABEL = { apartment: "아파트", commercial: "상가", redevelopment: "재개발" };
const REASON_LABEL = {
  below_median: "실거래가 대비 저가",
  price_drop: "호가 인하",
  keyword: "급매 키워드",
  premium_low: "감정가 대비 저가",
};

function won(n) {
  if (n == null) return "-";
  const eok = Math.floor(n / 100000000);
  const rest = Math.round((n % 100000000) / 10000);
  return eok > 0 ? `${eok}억 ${rest ? rest.toLocaleString() + "만" : ""}` : `${rest.toLocaleString()}만`;
}

function dDay(dateStr) {
  if (!dateStr) return "";
  const diff = Math.ceil((new Date(dateStr) - new Date(new Date().toDateString())) / 86400000);
  if (diff === 0) return "D-day";
  return diff > 0 ? `D-${diff}` : `D+${-diff}`;
}

function showTab(name) {
  dashboardEl.hidden = name !== "dashboard";
  uploadEl.hidden = name !== "upload";
  manageEl.hidden = name !== "manage";
  tabDashboard.classList.toggle("active", name === "dashboard");
  tabUpload.classList.toggle("active", name === "upload");
  tabManage.classList.toggle("active", name === "manage");
  if (name === "dashboard") loadDashboard();
  else if (name === "upload") loadUpload();
  else loadManage();
}
tabDashboard.onclick = () => showTab("dashboard");
tabUpload.onclick = () => showTab("upload");
tabManage.onclick = () => showTab("manage");

async function renderLoginForm(container, onSuccess) {
  container.innerHTML = `
    <div class="card">
      <h2>로그인</h2>
      <form class="inline" id="login-form">
        <input type="email" id="login-email" placeholder="이메일" autocomplete="username" required />
        <input type="password" id="login-password" placeholder="비밀번호" autocomplete="current-password" required />
        <button class="primary" type="submit">로그인</button>
      </form>
    </div>`;
  container.querySelector("#login-form").onsubmit = async (e) => {
    e.preventDefault();
    const email = container.querySelector("#login-email").value;
    const password = container.querySelector("#login-password").value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) alert(error.message); else onSuccess();
  };
}

async function loadDashboard() {
  dashboardEl.innerHTML = `<p class="muted">불러오는 중...</p>`;
  const { data: targets, error } = await supabase
    .from("targets").select("*").eq("active", true).order("name");
  if (error) { dashboardEl.innerHTML = `<p class="alert">${error.message}</p>`; return; }

  const { data: auctions } = await supabase
    .from("auction_items").select("*").eq("status", "upcoming")
    .not("bid_date", "is", null).order("bid_date").limit(10);

  const auctionCard = (auctions && auctions.length) ? `
    <div class="card">
      <h2>⚖️ 관심 경매물건</h2>
      ${auctions.map(a => `
        <div class="listing-row">
          <span>${a.title || a.case_number} <span class="badge">${dDay(a.bid_date)}</span></span>
          <span>${won(a.min_bid_price)}</span>
        </div>
      `).join("")}
    </div>` : "";

  const cards = await Promise.all(targets.map(async (t) => {
    const [{ data: listings }, { data: alerts }] = await Promise.all([
      supabase.from("listings").select("*").eq("target_id", t.id).eq("is_active", true).order("price").limit(8),
      supabase.from("alerts").select("*").eq("target_id", t.id).order("created_at", { ascending: false }).limit(5),
    ]);

    const alertHtml = (alerts || []).map(a => `
      <div class="alert">🚨 ${REASON_LABEL[a.reason] || a.reason} — ${new Date(a.created_at).toLocaleString("ko-KR")}</div>
    `).join("");

    const listingHtml = (listings || []).map(l => `
      <div class="listing-row"><span>${l.floor_info || ""} ${l.area_m2 ? Math.round(l.area_m2) + "㎡" : ""}</span><span>${won(l.price)}</span></div>
    `).join("") || `<p class="muted">매물 없음</p>`;

    return `
      <div class="card">
        <h2>${t.name} <span class="badge">${TYPE_LABEL[t.type] || t.type}</span></h2>
        ${alertHtml}
        <p class="muted" style="margin:8px 0 2px">매물 (업로드한 캡처)</p>
        ${listingHtml}
        <button class="ghost tx-toggle" data-target-id="${t.id}" style="margin-top:8px">실거래가(최근 6개월) 보기 ▾</button>
        <div class="tx-summary" id="tx-${t.id}" hidden></div>
      </div>
    `;
  }));

  dashboardEl.innerHTML = auctionCard + (cards.join("") || `<p class="muted">등록된 단지가 없습니다. 관리 탭에서 추가하세요.</p>`);

  dashboardEl.querySelectorAll(".tx-toggle").forEach(btn => {
    btn.onclick = () => toggleTxSummary(btn.dataset.targetId, btn);
  });
}

const txCache = {};

async function toggleTxSummary(targetId, btn) {
  const el = document.getElementById(`tx-${targetId}`);
  if (!el) return;
  if (!el.hidden) {
    el.hidden = true;
    if (btn) btn.textContent = "실거래가(최근 6개월) 보기 ▾";
    return;
  }
  el.hidden = false;
  if (btn) btn.textContent = "실거래가 접기 ▴";

  if (txCache[targetId]) { el.innerHTML = txCache[targetId]; return; }
  el.innerHTML = `<p class="muted">불러오는 중...</p>`;

  const { data, error } = await supabase
    .from("transactions").select("deal_date,price,area_m2,floor_info")
    .eq("target_id", targetId).order("deal_date", { ascending: false });
  if (error) { el.innerHTML = `<p class="alert">${error.message}</p>`; return; }

  const byMonth = {};
  (data || []).forEach(t => {
    const ym = t.deal_date.slice(0, 7);
    (byMonth[ym] ??= []).push(t);
  });
  const months = Object.keys(byMonth).sort().reverse().slice(0, 6);

  const html = months.length
    ? `<p class="muted" style="margin-top:8px">최근 6개월 실거래가 (개별 건)</p>` + months.map(ym => `
        <details>
          <summary>${ym} (${byMonth[ym].length}건)</summary>
          ${byMonth[ym].map(t => `
            <div class="listing-row">
              <span>${t.deal_date.slice(8, 10)}일 · ${t.area_m2 ? Math.round(t.area_m2 * 10) / 10 + "㎡" : "-"} · ${t.floor_info ? t.floor_info + "층" : "-"}</span>
              <span>${won(t.price)}</span>
            </div>`).join("")}
        </details>`).join("")
    : `<p class="muted" style="margin-top:8px">실거래 데이터 없음</p>`;

  txCache[targetId] = html;
  el.innerHTML = html;
}

async function loadUpload() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { renderLoginForm(uploadEl, loadUpload); return; }

  const { data: targets } = await supabase.from("targets").select("id,name").order("name");
  const { data: recent } = await supabase
    .from("captures").select("*").order("created_at", { ascending: false }).limit(10);

  const statusLabel = { pending: "처리 대기중", processed: "정리 완료", error: "실패" };

  uploadEl.innerHTML = `
    <div class="card">
      <h2>매물/경매 캡처 업로드</h2>
      <form class="inline" id="upload-form">
        <select id="u-kind">
          <option value="listing">매물</option>
          <option value="auction">경매물건</option>
        </select>
        <select id="u-target">
          <option value="">(연결할 단지/구역 선택, 경매는 선택사항)</option>
          ${(targets || []).map(t => `<option value="${t.id}">${t.name}</option>`).join("")}
        </select>
        <input type="file" id="u-file" accept="image/*" required />
        <button class="primary" type="submit">업로드</button>
      </form>
      <p class="muted">업로드하면 다음 자동 실행(최대 30분 이내) 때 Claude Vision이 읽어서 자동으로 정리해요.</p>
    </div>
    <div class="card">
      <h2>최근 업로드</h2>
      ${(recent || []).map(c => `
        <div class="listing-row">
          <span>${c.kind === "listing" ? "매물" : "경매"} · ${new Date(c.created_at).toLocaleString("ko-KR")}</span>
          <span class="status-${c.status}">${statusLabel[c.status] || c.status}</span>
        </div>
      `).join("") || `<p class="muted">업로드 내역 없음</p>`}
    </div>
    <button class="ghost" id="logout-upload">로그아웃</button>
  `;

  document.getElementById("upload-form").onsubmit = async (e) => {
    e.preventDefault();
    const file = document.getElementById("u-file").files[0];
    if (!file) return;
    const kind = document.getElementById("u-kind").value;
    const targetId = document.getElementById("u-target").value || null;
    const path = `uploads/${Date.now()}-${file.name}`;

    const { error: uploadError } = await supabase.storage.from("captures").upload(path, file);
    if (uploadError) { alert(uploadError.message); return; }

    const { error: insertError } = await supabase
      .from("captures").insert({ kind, image_path: path, target_id: targetId });
    if (insertError) { alert(insertError.message); return; }

    alert("업로드 완료! 다음 자동 실행 때 정리됩니다.");
    loadUpload();
  };

  document.getElementById("logout-upload").onclick = async () => {
    await supabase.auth.signOut();
    loadUpload();
  };
}

async function loadManage() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { renderLoginForm(manageEl, loadManage); return; }

  const { data: targets } = await supabase.from("targets").select("*").order("name");

  manageEl.innerHTML = `
    <div class="card">
      <h2>새 단지/구역 추가</h2>
      <form class="inline" id="add-form">
        <input id="f-name" placeholder="이름 (예: 잠실 엘스)" required />
        <select id="f-type">
          <option value="apartment">아파트</option>
          <option value="commercial">상가</option>
          <option value="redevelopment">재개발구역</option>
        </select>
        <input id="f-lawd" placeholder="법정동코드 5자리 (예: 11710)" required />
        <input id="f-threshold" type="number" placeholder="급매 판정 기준 % (기본 10)" value="10" />
        <button class="primary" type="submit">추가</button>
      </form>
    </div>
    ${(targets || []).map(t => `
      <div class="card">
        <h2>${t.name} <span class="badge">${TYPE_LABEL[t.type] || t.type}</span> ${t.active ? "" : '<span class="badge">비활성</span>'}</h2>
        <p class="muted">법정동코드 ${t.lawd_cd} · 기준 ${t.discount_threshold_pct}%</p>
        <div class="row-actions">
          <button class="ghost" data-action="toggle" data-id="${t.id}" data-active="${t.active}">${t.active ? "비활성화" : "활성화"}</button>
          <button class="ghost" data-action="delete" data-id="${t.id}">삭제</button>
        </div>
      </div>
    `).join("")}
    <button class="ghost" id="logout">로그아웃</button>
  `;

  document.getElementById("add-form").onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await supabase.from("targets").insert({
      name: document.getElementById("f-name").value,
      type: document.getElementById("f-type").value,
      lawd_cd: document.getElementById("f-lawd").value,
      discount_threshold_pct: Number(document.getElementById("f-threshold").value) || 10,
    });
    if (error) alert(error.message); else loadManage();
  };

  manageEl.querySelectorAll("[data-action]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      if (btn.dataset.action === "toggle") {
        await supabase.from("targets").update({ active: btn.dataset.active !== "true" }).eq("id", id);
      } else if (btn.dataset.action === "delete") {
        if (!confirm("정말 삭제하시겠어요? 관련 매물/이력도 함께 삭제됩니다.")) return;
        await supabase.from("targets").delete().eq("id", id);
      }
      loadManage();
    };
  });

  document.getElementById("logout").onclick = async () => {
    await supabase.auth.signOut();
    loadManage();
  };
}

loadDashboard();
</script>
</body>
</html>
